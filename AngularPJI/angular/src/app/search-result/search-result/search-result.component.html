<h1 class="sign" align="center">Search Stores</h1>
<form class="form1" (ngSubmit)="submit()" align="center" style="font-size:18px">

        <input type="number" align="center" placeholder="Store Number" name="num"
        [(ngModel)]="num" style="border-radius:4px;" title="Enter numbers only">&nbsp;

        <input type="text"  align="center" placeholder="City" name="city"
         [(ngModel)]="city" style="border-radius:4px;"> &nbsp;

        <input type="number"  align="center" placeholder="Zipcode" name="zipcode"
         [(ngModel)]="zipcode" style="border-radius:4px;" title="Enter numbers only">&nbsp;

   <button type="submit" align="center" style="color: #fff;
   background: linear-gradient(70deg, rgb(186, 100, 198) 2%, rgb(73, 31, 172)100%);
   padding-left: 30px;
    padding-right: 30px;
    padding-bottom: 1px;
    padding-top: 2px;
    border-radius: .5em;
    font-size: 20px;
    font-family: 'Times New Roman', serif;
    box-shadow: 10px 10px 5px light grey;">Search</button>

    <button (click)="reset()" type="Reset" align="center" style="color: #fff;
     background: linear-gradient(70deg, rgb(186, 100, 198) 2%, rgb(73, 31, 172)100%);
     padding-left: 30px;
    padding-right: 30px;
    padding-bottom: 1px;
    padding-top: 2px;
    border-radius: .5em;
    font-size: 20px;
    font-family: 'Times New Roman', serif;
    box-shadow: 10px 10px 5px light grey;"
    >Reset</button>

</form>
<br>
<p style="text-align:center;font-size:20px;" class="text-danger">{{message}}</p>

<table  *ngIf="isNotEmpty()" class="table table-striped table-hover table-bordered" style="width:75%; font-family: 'Times New Roman', serif;" align="center">
    <thead>
        <tr>
            <th>S.No</th>
            <th>Store Number</th>
            <th>City</th>
            <th>Zipcode</th>
            <th *ngIf="checkAccessLevel()">Store Parameters</th>
        </tr>
    </thead>

    <tbody>
            <tr *ngFor="let s of store; index as id">
                <td>{{id+1}}</td>
                <td #num >{{s.number}}</td>
                <td>{{s.city}}</td>
                <td>{{s.zipcode}}</td>

                <div *ngIf="checkAccessLevel()">
                  <td>
                      <table   *ngFor="let a of s.storeParameterList">
                          <tr>{{a}}</tr>
                      </table>
                  </td>
              </div>
            </tr>
  </tbody>

</table>
