  <h2 class="text-center">User List</h2>
  <div class="table-container">
  <table class="table table-striped table-hover table-bordered">

      <thead>
          <tr>
              <th>S.No</th>
              <!-- <th>System User Oid</th> -->
              <th>Name</th>
              <th>UserName</th>
              <th>Access Level</th>
              <th>Actions</th>
          </tr>
      </thead>
      <tbody>
          <tr *ngFor="let user of Users | paginate:{itemsPerPage:5, currentPage : p}; index as id">
              <td> {{id+1}}  </td>
               <!-- <td> {{user.systemUserOid}}  </td> -->
              <td> {{ user.name }} </td>
              <td> {{ user.userName }} </td>
              <td> {{ user.accessLevel }} </td>
              <td>
                  <button (click) = "updateUser(user.systemUserOid)" class="btn btn-info">Update</button>
                  <button (click) = "deleteUser(user.systemUserOid)" class="btn btn-danger">Delete</button>
              </td>
          </tr>
      </tbody>
  </table>
  </div>
<pagination-controls (pageChange)="p = $event"></pagination-controls>
